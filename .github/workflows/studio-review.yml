name: Studio review checks
on:
  push:
    branches: [studio-1.5.8-design-review]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/studio-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0' 
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and APK
        run: bash ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - name: Preserve test results and native card previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-review-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 90
      - name: Preserve APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-1.7.0-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Package a permanent download
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          cp app/build/outputs/apk/debug/app-debug.apk "$package_dir/NegahJavan-Studio-1.7.0.apk"
          cp RELEASE-1.7.0.md "$package_dir/"
          cp docs/licenses/Estedad-OFL.txt "$package_dir/"
          printf '%s\n' "$GITHUB_SHA" > "$package_dir/SOURCE_COMMIT.txt"
          mkdir -p dist
          zip -j -9 dist/NegahJavan-Studio-1.7.0.zip "$package_dir/"*

      - name: Commit APK and native review previews to this branch
        run: |
          set -euo pipefail
          preview_dir="docs/design/previews/$GITHUB_SHA"
          mkdir -p "$preview_dir"
          cp app/build/reports/studio-158/*.png "$preview_dir/"
          printf 'Native Android renders for commit %s. Photo samples use a synthetic test image.\n' "$GITHUB_SHA" > "$preview_dir/README.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$preview_dir" dist/NegahJavan-Studio-1.7.0.zip
          git diff --cached --quiet || git commit -m "Save APK and native card previews for $GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
