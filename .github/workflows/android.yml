name: Android CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "dist/**"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate backend syntax
        run: python -m py_compile server/main.py

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build final installable APK
        run: ./gradlew assembleDebug

      - name: Publish final APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/negahjavan-apk
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/negahjavan-apk/NegahJavanSmartNewsCard-1.0.0-final.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          mkdir -p dist
          cp /tmp/negahjavan-apk/NegahJavanSmartNewsCard-1.0.0-final.apk dist/NegahJavanSmartNewsCard-1.0.0-final.apk
          git add dist/NegahJavanSmartNewsCard-1.0.0-final.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to commit."
          else
            git commit -m "build: publish final APK 1.0.0 [skip ci]"
            git push origin HEAD:main
          fi
