name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "ai-studio-1.1", "online-backend-1.2", "fix/zero-cost-stability-1.4.1" ]
    paths-ignore:
      - "dist/**"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Keep official builds free by default. An empty endpoint forces the
      # on-device analyzer and local image fallback, avoiding paid API calls.
      AI_BASE_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Webflow Cloud backend
        run: |
          npm install --no-audit --no-fund
          npm run test-cloud
          npm run build

      - name: Validate backend
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile main.py
          python test_main.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Unit tests and lint
        run: |
          ./gradlew testDebugUnitTest
          ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Free disk for Android system image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h /home/runner

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test real MP4 export on Android
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          disk-size: 2048M
          emulator-boot-timeout: 300
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload premium card previews
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: premium-card-previews
          path: app/build/reports/premium-cards/*.png
          if-no-files-found: error

      - name: Prepare final APK
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build-final
          FINAL="build-final/NegahJavanSmartNewsCard-1.5.3-final.apk"

          if [ -n "${SIGNING_KEY:-}" ] && [ -n "${STORE_PASSWORD:-}" ]; then
            echo "Permanent signing secrets detected; building signed release."
            ./gradlew assembleRelease
            printf '%s' "$SIGNING_KEY" | base64 --decode > signing.jks
            UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
            BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks signing.jks \
              --ks-key-alias negahjavan \
              --ks-pass env:STORE_PASSWORD \
              --key-pass env:STORE_PASSWORD \
              --out "$FINAL" \
              aligned.apk
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
            rm -f signing.jks aligned.apk
          else
            echo "No permanent signing secrets; publishing debug-signed test APK."
            cp app/build/outputs/apk/debug/app-debug.apk "$FINAL"
          fi

          ls -lh "$FINAL"

      - name: Upload tested APK artifact
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NegahJavanSmartNewsCard-1.5.3
          path: build-final/NegahJavanSmartNewsCard-1.5.3-final.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish tested APK to GitHub Releases
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="v1.5.3"
          APK_NAME="NegahJavanSmartNewsCard-1.5.3-final.apk"
          APK="build-final/$APK_NAME"
          test -s "$APK"
          (cd build-final && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          # کارت‌ساز نگاه جوان ۱.۵.۳ — اصلاح اندازه و چیدمان پست
          - تحلیل خبر روی گوشی و کاور گرافیکی محلی، بدون نیاز اجباری به API پولی
          - جلوگیری از نمایش نتیجهٔ تحلیل مربوط به متن قدیمی
          - رابط مرتب‌تر با سه بخش مستقل کارت خبر، پست اینستاگرام و ویدئو/ریلز
          - تنظیمات طراحی و چیدمان پیشرفته به‌صورت جمع‌شونده
          - بزرگ‌تر شدن تیتر و کادر خبر در خروجی‌های اینستاگرام
          - پیش‌فرض ویدئو روی ریلز ۹:۱۶؛ خروجی پست ۴:۵ همچنان قابل انتخاب
          - حفظ قابلیت‌های فعلی کارت، پست اینستاگرام و خروجی ویدئو
          - خروجی 1080p با بیت‌ریت تطبیقی 12 تا 24 Mbps
          - خروجی سریع 720p با بیت‌ریت 4.5 تا 8 Mbps

          - انتخاب فیلم از گوشی و پیش‌نمایش زنده با قالب خبری
          - چهار قالب پست و ویدئو با امکان ویرایش و جابه‌جایی متن و برند
          - خروجی MP4 با صدای اصلی، در اندازه پست ۴:۵ و ریلز ۹:۱۶
          - ذخیره در گالری، اشتراک‌گذاری و کپی کپشن

          تست‌های واحد، lint و آزمون ساخت MP4 در شبیه‌ساز اندروید قبل از انتشار اجرا شده‌اند.
          فایل APK از بخش Assets قابل دریافت است؛ نیازمند اندروید ۱۲ یا جدیدتر.
          انتشار نهایی در اینستاگرام توسط کاربر انجام می‌شود.
          NOTES
          printf '\nBuild commit: `%s`\n\nChecks: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"

          if gh release view "$TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            if [ "$(jq -r .targetCommitish "$RUNNER_TEMP/existing-release.json")" != "$GITHUB_SHA" ]; then
              echo "::error::This version already belongs to another commit. Bump the version before publishing."
              exit 1
            fi
            if [ "$(jq -r .isDraft "$RUNNER_TEMP/existing-release.json")" = "false" ]; then
              echo "This commit is already published; preserving its release assets."
              exit 0
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "NegahJavan Smart News Card 1.5.3 — Instagram Size Fix" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

          # Keep the release as a draft until both files have uploaded successfully.
          gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          gh release edit "$TAG" --draft=false --latest
          RELEASE_URL="$(gh release view "$TAG" --json url --jq .url)"
          printf '## Download\n\n[Version 1.5.3](%s)\n' "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
