name: Android CI

on:
  push:
    branches: [ "main", "ai-studio-1.1", "online-backend-1.2" ]
    paths-ignore:
      - "dist/**"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AI_BASE_URL: ${{ vars.AI_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Webflow Cloud backend
        run: |
          npm install --no-audit --no-fund
          npm run test-cloud
          npm run build

      - name: Validate backend
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile main.py
          python test_main.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Unit tests and lint
        run: |
          ./gradlew testDebugUnitTest
          ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test real MP4 export on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload premium card previews
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: premium-card-previews
          path: app/build/reports/premium-cards/*.png
          if-no-files-found: error

      - name: Prepare final APK
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build-final
          FINAL="build-final/NegahJavanSmartNewsCard-1.4.0-final.apk"

          if [ -n "${SIGNING_KEY:-}" ] && [ -n "${STORE_PASSWORD:-}" ]; then
            echo "Permanent signing secrets detected; building signed release."
            ./gradlew assembleRelease
            printf '%s' "$SIGNING_KEY" | base64 --decode > signing.jks
            UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
            BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
            "$BUILD_TOOLS/apksigner" sign               --ks signing.jks               --ks-key-alias negahjavan               --ks-pass env:STORE_PASSWORD               --key-pass env:STORE_PASSWORD               --out "$FINAL"               aligned.apk
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
            rm -f signing.jks aligned.apk
          else
            echo "No permanent signing secrets; publishing debug-signed test APK."
            cp app/build/outputs/apk/debug/app-debug.apk "$FINAL"
          fi

          ls -lh "$FINAL"

      - name: Upload tested APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: NegahJavanSmartNewsCard-1.4.0
          path: build-final/NegahJavanSmartNewsCard-1.4.0-final.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish final APK to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          mkdir -p dist
          cp build-final/NegahJavanSmartNewsCard-1.4.0-final.apk dist/NegahJavanSmartNewsCard-1.4.0-final.apk
          mkdir -p dist/premium-previews
          cp app/build/reports/premium-cards/*.png dist/premium-previews/
          git add dist/NegahJavanSmartNewsCard-1.4.0-final.apk
          git add dist/premium-previews
          if git diff --cached --quiet; then
            echo "APK unchanged; nothing to commit."
          else
            git commit -m "build: publish final APK 1.4.0 [skip ci]"
            git push origin HEAD:main
          fi


