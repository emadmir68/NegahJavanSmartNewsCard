services:
  - type: web
    name: negahjavan-ai
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-flare
      - key: CORS_ORIGINS
        value: ""
      - key: OPENAI_API_KEY
        sync: false
